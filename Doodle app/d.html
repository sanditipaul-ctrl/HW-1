<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.9.0/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.9.0/addons/p5.dom.min.js"></script>
    <script src="https://unpkg.com/ml5@latest/dist/ml5.min.js"></script>
    <title>Document</title>
    <style>
    body{
    background: linear-gradient(-45deg, #00f2fe, #fbc2eb);
    background-attachment: fixed;
}
h1{
    margin-top: 15px;
    background-color: #e0d2ff;
    box-shadow: 2px 4px 4px rgb(135, 180, 135);
}

canvas{
    margin-top: 190px;
    border-radius: 20px;
    animation: example;
    animation-duration: 10s;
    animation-iteration-count: infinite;
}
@keyframes example{
    from{box-shadow: 2px 4px 20px rgb(9, 44, 9);}
    to{box-shadow: 2px 4px 20px rgb(33, 181, 33);}
}
button{
    background-color: #4facfe;
    border: none;
    border-radius: 15px;
    width: 150px;
    height: 40px;
}
canvas{
    margin-bottom: 200px;
}
</style>
</head>

<body>
    <center>
        <h1>AI Doodle App</h1>
        <br>
        <h3 id="object">This is : </h3>
        <h3 id="acc">Accuracy : </h3><br>
        <button onclick="clear_canvas()">Clear Canvas</button><br><br>
    </center>
    <script>let canvas;
let classifier;

function setup()
{
    canvas = createCanvas(400, 400);
    background('white');
    canvas.center();
    canvas.mouseReleased(classifyCanvas);
    synth = window.speechSynthesis;    //text to write
}

function preload()
{
    classifier = ml5.imageClassifier('Doodle',modelload)
}

function modelload()
{
    console.log("model is loaded...")
}

function draw()
{
    strokeWeight(30)
    if(mouseIsPressed)
    {
        line(pmouseX,pmouseY,mouseX,mouseY)
    }
}

function classifyCanvas()
{
    if(classifier)
    {
        classifier.classify(canvas,gotResult)
    }
    else{
        console.log("classifier is not loaded yet")
    }
}

function gotResult(result)
{
    console.log(result);
    var l = result[0].label;
    var con = (result[0].confidence * 100).toFixed(2)
    document.getElementById('object').innerText= "This is : " + l;
    document.getElementById('acc').innerText= "Accuracy is : " + con + "%";


    let say = new SpeechSynthesisUtterance('This is'+l)
    synth.speak(say)
}
function clear_canvas()
{
    background('white')
}</script>
    
</body>
</html>
